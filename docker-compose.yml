name: olcys

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: olcys
      POSTGRES_PASSWORD: olcys
      POSTGRES_DB: olcys
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olcys"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Synthetic "mini-internet" (fixtures/sandbox-web), no external access.
  sandbox:
    image: nginx:alpine
    ports: ["8088:80"]
    volumes: ["./fixtures/sandbox-web:/usr/share/nginx/html:ro"]
    networks:
      default:
        aliases: [sandbox-web]

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql://olcys:olcys@db:5432/olcys
      API_PORT: "3000"
      SANDBOX_BASE_URL: http://sandbox-web
    ports: ["${API_PORT:-3000}:3000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["${WEB_PORT:-5173}:80"]
    depends_on: [api]

volumes:
  dbdata:
